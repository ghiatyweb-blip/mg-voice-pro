<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MG Voice Pro</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

.box{
    background:#1b1b1b;
    padding:25px;
    border-radius:18px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:220px;
    box-sizing:border-box;
    background:#0b0b0b;
    color:white;
    border:1px solid #444;
    border-radius:12px;
    padding:15px;
    font-size:18px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

audio{
    width:100%;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>🎙️ MG Voice Pro</h1>

<p>اكتب النص وحوله لصوت مصري مناسب لفيديوهات MG Gaming</p>

<textarea id="text" placeholder="اكتب النص هنا..."></textarea>

<button onclick="generateVoice()">
🎙️ إنشاء الصوت
</button>

<audio id="audio" controls></audio>

</div>

</div>

<script>

async function generateVoice(){

    const text =
    document.getElementById("text").value.trim();

    if(!text){
        alert("اكتب النص أولاً");
        return;
    }

    const response = await fetch("/generate",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({text:text})

    });

    if(!response.ok){

        alert("حدث خطأ أثناء إنشاء الصوت");
        return;

    }

    const blob = await response.blob();

    const url = URL.createObjectURL(blob);

    document.getElementById("audio").src = url;

}

</script>

</body>
</html>
